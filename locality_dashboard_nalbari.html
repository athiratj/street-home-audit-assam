      table.dashboard th.sort-desc::after { content: " ↓"; opacity: 1; }
      table.dashboard td {
        padding: 8px 8px;
        text-align: center;
        border-right: 1px solid #F0F0F0;

      }
      table.dashboard td.locality {
        text-align: left;
        font-weight: 600;
        background: #FAFAFA;
        position: sticky; left: 0;
        z-index: 1;
        min-width: 220px;
        max-width: 260px;
        border-right: 2px solid #E0E0E0;
      }
      table.dashboard td.topissues {
        text-align: left;
        color: #555;
        font-size: 12px;
        min-width: 260px;
      }
      table.dashboard td.na { background: #F2F2F2; color: #999; }
      table.dashboard tr:hover td:not(.locality) { filter: brightness(0.95); }
      table.dashboard tr:hover td.locality { background: #EEF3F7; }
      
      .legend {
        margin-top: 24px;
        padding: 16px 20px;
        background: white;
        border-radius: 6px;
        border: 1px solid #E0E0E0;
      }
      .legend-title { font-weight: 700; font-size: 14px; margin-bottom: 10px; }
      .legend-row { display: flex; align-items: center; margin-bottom: 8px; }
      .gradient {
        width: 180px; height: 14px;
        border: 1px solid #888;
        margin-right: 12px;
        flex-shrink: 0;
      }
      .legend-lbl { font-size: 12px; color: #444; }
      .col-key {
        margin-top: 12px; padding-top: 12px;
        border-top: 1px solid #EEE;
        font-size: 11.5px; color: #555; line-height: 1.55;
      }
      .note {
        margin-top: 10px;
        padding: 10px 12px;
        background: #FFF8E7;
        border-left: 3px solid #F4A259;
        font-size: 12px; color: #4a4030;
      }
      
      @media print {
        body { padding: 12px; background: white; font-size: 11px; }
        .table-wrap { max-height: none; overflow: visible; box-shadow: none; }
        table.dashboard th { position: static; }
        table.dashboard td.locality { position: static; }
      }

    <script>
    (function() {
      const table = document.querySelector('table.dashboard');
      const headers = table.querySelectorAll('th.sortable');
      const tbody = table.querySelector('tbody');
      headers.forEach((th, colIdx) => {
        th.addEventListener('click', () => {
          const currentDir = th.classList.contains('sort-asc') ? 'asc' : th.classList.contains('sort-desc') ? 'desc' : null;
          const newDir = currentDir === 'desc' ? 'asc' : 'desc';
          headers.forEach(h => h.classList.remove('sort-asc','sort-desc'));
          th.classList.add(newDir === 'asc' ? 'sort-asc' : 'sort-desc');
          
          const rows = Array.from(tbody.querySelectorAll('tr'));
          rows.sort((a,b) => {
            const av = a.children[colIdx].getAttribute('data-value');
            const bv = b.children[colIdx].getAttribute('data-value');
            // If data-value not set (label/text cols), sort by text
            const aVal = av !== null ? (av === '' ? -Infinity : parseFloat(av)) : a.children[colIdx].innerText;
            const bVal = bv !== null ? (bv === '' ? -Infinity : parseFloat(bv)) : b.children[colIdx].innerText;
            let cmp;
            if (typeof aVal === 'number' && typeof bVal === 'number') {
              cmp = aVal - bVal;
            } else {
              cmp = String(aVal).localeCompare(String(bVal));
            }
            return newDir === 'asc' ? cmp : -cmp;
          });
          rows.forEach(r => tbody.appendChild(r));
        });
      });
    })();
    </script>
